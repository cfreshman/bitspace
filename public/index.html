<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BITSPACE</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div
      id="bitspace-theme-source"
      hidden
      style="color: #74acef; background: #231f33; --bitspace-backing: #000000;"
    ></div>
    <canvas id="scene" width="384" height="384"></canvas>
    <canvas id="minimap" width="384" height="384" aria-hidden="true"></canvas>
    <pre id="perf-debug-panel" class="perf-debug-panel" hidden></pre>
    <section id="mapgen-panel" class="mapgen-panel" hidden>
      <div class="mapgen-controls">
        <label>
          seed
          <input id="mapgen-seed" type="text" autocomplete="off" spellcheck="false">
        </label>
        <label>
          nodes
          <input id="mapgen-nodes" type="number" min="0" max="96" step="1">
        </label>
        <label>
          players
          <input id="mapgen-players" type="number" min="1" max="8" step="1">
        </label>
        <label>
          loops
          <input id="mapgen-links" type="number" min="0" max="48" step="1">
        </label>
        <label>
          degree
          <input id="mapgen-degree" type="number" min="1" max="8" step="1">
        </label>
        <label>
          radius
          <input id="mapgen-radius" type="number" min="0.25" max="5" step="0.05">
        </label>
        <label>
          center
          <input id="mapgen-center" type="number" min="0.5" max="10" step="0.1">
        </label>
        <label>
          curve
          <input id="mapgen-curve" type="number" min="0" max="8" step="0.1">
        </label>
        <label>
          feather
          <input id="mapgen-feather" type="number" min="0" max="4" step="0.05">
        </label>
        <button id="mapgen-regenerate" type="button">regenerate</button>
        <button id="mapgen-random" type="button">random seed</button>
      </div>
      <canvas id="mapgen-preview" width="768" height="768"></canvas>
      <pre id="mapgen-stats" class="mapgen-stats"></pre>
    </section>
    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/client.js"></script>
  </body>
</html>
